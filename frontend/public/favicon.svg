<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aethApex" x1="50" y1="12" x2="50" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="aethOrbit" x1="20" y1="50" x2="80" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64748B" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="aethGlow" cx="50" cy="52" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#aethGlow)" />

  <!-- Neural Orbital Trajectory -->
  <ellipse cx="50" cy="52" rx="36" ry="16" stroke="url(#aethOrbit)" stroke-width="1.8" transform="rotate(-20 50 52)" stroke-dasharray="3 2" />

  <!-- Abstract Monolithic 'A' Apex -->
  <!-- Left Wing -->
  <path d="M 50 14 L 22 78 C 22 78 30 74 38 68 L 50 40 Z" fill="url(#aethApex)" opacity="0.95" />
  
  <!-- Right Wing -->
  <path d="M 50 14 L 78 78 C 78 78 70 74 62 68 L 50 40 Z" fill="url(#aethApex)" opacity="0.8" />

  <!-- Inner Architectural Facet -->
  <path d="M 50 40 L 38 68 C 44 65 56 65 62 68 Z" fill="#0B0C10" />

  <!-- Interconnected Neural Bridge & Nodes -->
  <line x1="33" y1="57" x2="67" y2="57" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  
  <!-- Apex Node -->
  <circle cx="50" cy="15" r="3.2" fill="#FFFFFF" />
  <circle cx="50" cy="15" r="5" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.4" />

  <!-- Orbital Intelligence Satellites -->
  <circle cx="21" cy="62" r="2.8" fill="#FFFFFF" />
  <circle cx="79" cy="42" r="2.8" fill="#FFFFFF" />
  <circle cx="50" cy="57" r="3" fill="#FFFFFF" />
</svg>